packages:
  - docs-site

# pnpm 11 reads its settings from this file; .npmrc holds only auth and
# registry settings, and anything else there is silently ignored.
#
# Pin exact versions on every `pnpm add` (CLAUDE.md: "Pin dependency versions
# exactly. No ^ ranges."). A unit test also refuses any range in package.json.
saveExact: true
# Refuse to install on a pnpm outside package.json's `engines` (pnpm 11),
# instead of failing later in odd ways. Node 26 is held by `devEngines`, which
# pnpm checks on install and run; `engines.node` also admits Node 24 so
# Dependabot's npm updater can run (ADR-076).
engineStrict: true
# The bleeding-edge stack (Next 16 / React 19 / Tailwind 4) has unavoidable
# peer mismatches from packages not yet updated for React 19. Don't hard-fail
# installs on peers (ADR-003). Warnings still print.
strictPeerDependencies: false

allowBuilds:
  # next-intl's optional message extractor (unused): their binaries come as
  # optional dependencies, the install scripts only re-check them.
  '@parcel/watcher': false
  # CLI binaries ship as platform-specific optional dependencies; no fallback download script.
  '@sentry/cli': false
  '@swc/core': false
  esbuild: true
  msgpackr-extract: true
  sharp: false
  unrs-resolver: false
  # wrangler's local runtime: its binary comes as an optional dependency, the
  # install script only re-checks it (the relay runs locally without it).
  workerd: false

# vite@8.3.0 declares a dependency on lightningcss@^1.33.0, which is not yet
# published (latest is 1.32.0), breaking installs. Pin to the real latest —
# lightningcss is only used for CSS transforms (Tailwind), never in our tests.
overrides:
  lightningcss: 1.32.0
  # drizzle-kit's old loader (@esbuild-kit) pins esbuild 0.18, which has a
  # dev-server advisory (GHSA-67mh-4wv8-2f99). We never run esbuild's dev
  # server, but a clean `pnpm audit` keeps real advisories visible (Phase 7.6
  # review). Both of drizzle-kit's esbuilds follow the app's own version:
  # 0.25.12's Go runtime carries critical image-scan findings, and drizzle-kit
  # reaches the worker image as better-auth's optional peer (9.9).
  '@esbuild-kit/core-utils>esbuild': 0.28.2
  'drizzle-kit>esbuild': 0.28.2
  # Patched transitive versions, inside the ranges their parents already
  # accept: ip-address GHSA-j6r3-76f7-8jcv + GHSA-h3mg-xc3c-68pw (via shadcn,
  # now dev-only), brace-expansion 1.x (via eslint's minimatch 3). braces
  # GHSA-vfj7-8cjw-p6xm declares 3.0.4 as patched, but npm still has no 3.0.4;
  # it only reaches dev tools. Re-check `pnpm audit` when 3.0.4 is published.
  'ip-address@10': 10.7.3
  'brace-expansion@1': 1.1.21
  # Patched transitive releases for the GitHub security alerts published in
  # October 2026: proxy-addr IP spoofing (GHSA-jqcg-44mw-7w3h) and
  # source-map-js event-loop denial of service (GHSA-68fv-2mgg-jv7q).
  proxy-addr: 2.0.8
  source-map-js: 1.2.2
  # Additional high-severity advisories found by the registry audit: the MCP
  # SDK OAuth client (via shadcn) and sharp's librsvg build (via Miniflare).
  '@modelcontextprotocol/sdk': 1.31.0
  sharp: 0.35.5
