# Local dev services for echoandaura. The Next.js app and the BullMQ worker run
# on the host (`pnpm dev` / `pnpm worker`); Postgres and Redis run here.
# Images are pinned to concrete majors (not :latest) for reproducibility —
# "Pin dependency versions exactly."
#
# This file contains NO credentials. Every value comes from `.env` (git-ignored;
# copy `.env.example` to create it). The `${VAR:?...}` form makes Compose refuse
# to start with a clear error if a variable is missing, instead of silently
# falling back to a baked-in default.
services:
  postgres:
    image: postgres:17
    container_name: echoandaura-postgres
    restart: unless-stopped
    environment:
      # Read by the postgres image ONLY on the first start with an empty volume;
      # that is when the role and database are created. Changing them later
      # requires resetting the volume (`docker compose down -v`).
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # `$$` escapes Compose interpolation so the shell *inside* the container
      # reads its own POSTGRES_USER / POSTGRES_DB — no values repeated here.
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: echoandaura-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  # S3-compatible object storage for local dev and e2e. Production uses
  # Cloudflare R2 through the same S3 API — only env vars differ.
  # ADR-078: MinIO no longer publishes images, so this is Pigsty's fork of
  # the same server (`mc` included, MinIO's flags and env). Pinned by digest
  # too: a third party's tag could be pushed again.
  minio:
    image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z@sha256:635197cb9f36d01bee221d34d1c7d7960f6a95c48b0b6c01d99cd13bdae51a46
    container_name: echoandaura-minio
    restart: unless-stopped
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    ports:
      - '9000:9000' # S3 API
      - '9001:9001' # web console
    volumes:
      - miniodata:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: creates the bucket and makes objects publicly readable, so
  # R2_PUBLIC_URL=http://localhost:9000/<bucket> serves images like R2's
  # public bucket URL would. Safe to re-run; exits 0 when done.
  minio-init:
    image: pgsty/mc:RELEASE.2026-09-16T00-00-00Z@sha256:cfc83108c3abb371f8fb84d99c1fdc88f8c237e022409b0081fb7c0a3be634dd
    container_name: echoandaura-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
      R2_BUCKET: ${R2_BUCKET:?Set R2_BUCKET in .env}
    entrypoint: >
      /bin/sh -c '
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" &&
        mc mb --ignore-existing "local/$$R2_BUCKET" &&
        mc anonymous set download "local/$$R2_BUCKET"
      '

volumes:
  pgdata:
  redisdata:
  miniodata:
