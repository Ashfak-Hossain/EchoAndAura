# The Dokploy version a NEW server gets (SERVER.md § 8). Dokploy updates
# itself from its own dashboard afterwards and this role never upgrades it,
# so production can move ahead of this pin. When it does, the role prints
# a reminder: bump this to match, so a rebuild comes out like production.
dokploy_version: v0.30.8

# files/dokploy-install.sh is Dokploy's own install script (Apache-2.0),
# kept here: what runs as root on a new server is what was read and
# reviewed in a PR, and a rebuild never depends on the script upstream
# being unchanged that night. Downloaded from https://dokploy.com/install.sh
# on 2026-09-27 and again, identical, on 2026-10-06. One change (ADR-085,
# marked in the file): where Docker is missing it stops instead of piping
# get.docker.com into sh; the docker_engine role installs Docker first.
# To move to a newer script: download it, read the diff, make that change
# again, replace the file, update this hash
# (tests/unit/ansible-dokploy.test.ts keeps the two equal).
dokploy_install_sha256: e6be61fcce1424bd93321d4d6f8949594702539eae55ec8ba350de937117071f
