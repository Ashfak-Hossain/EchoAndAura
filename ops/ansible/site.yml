# The production server, as code (ADR-063). One role per SERVER.md section;
# each role's tasks say which. Run through ops/ansible/run.sh.
- name: Echo & Aura server
  hosts: all
  become: false
  roles:
    - role: base
      tags: [base]
    - role: ssh
      tags: [ssh]
    - role: swap
      tags: [swap]
    - role: firewall
      tags: [firewall]
    - role: docker_config
      tags: [docker]
    # Before docker_engine: its rules must be waiting when Docker first
    # starts, before Dokploy's script publishes port 3000.
    - role: origin_lockdown
      tags: [origin_lockdown]
    # Docker's first start: after daemon.json and the lockdown are waiting,
    # before Dokploy's script, which no longer installs it (ADR-085).
    - role: docker_engine
      tags: [docker]
    - role: dokploy
      tags: [dokploy]
    - role: sysctl
      tags: [sysctl]
    - role: apt_clean
      tags: [apt]
    - role: disk_alert
      tags: [disk_alert]
    - role: traefik
      tags: [traefik]
