name: Release

# ADR-041. A version tag (vX.Y.Z) on a commit that main has already built
# and deployed. Deploys stay continuous from main (ADR-036): a tag marks a
# milestone and deploys nothing. It does two things:
#   - names that commit's images with the version, so a rollback can pin
#     IMAGE_TAG=v1.0.0 (DEPLOY.md → Rolling back), after checking that the
#     Deploy workflow signed their provenance (ADR-075);
#   - publishes the GitHub Release: the tag's CHANGELOG.md section, the
#     images' digests, then the notes GitHub generates from the merged PRs
#     (.github/release.yml).
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

# Granted to the one job, not the workflow (OpenSSF Token-Permissions, ADR-083).
permissions: {}

env:
  REGISTRY: ghcr.io/ashfak-hossain

jobs:
  release:
    # Pinned like CI (ci.yml → verify): ubuntu-latest moves to Ubuntu 26.
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Only what main shipped gets a version: its images exist, and CI
      # was green on it.
      - name: The tag is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      # Before anything is named: the version needs its CHANGELOG.md section,
      # and package.json must carry the same version.
      - name: Release notes
        run: node .github/scripts/release-notes.mjs "$GITHUB_REF_NAME" > "$RUNNER_TEMP/release-notes.md"

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A new name for the existing images: nothing is rebuilt, so the
      # version runs exactly what production ran. Fails if the Deploy
      # workflow never built this commit.
      # ADR-075: the sha tag is resolved to a digest once. That digest must
      # carry provenance signed by this repository's Deploy workflow running
      # from main on GitHub's runners, and the image's revision label must be
      # this exact commit (the label is inside the signed digest; a short sha
      # tag alone could collide). Both images pass before either is named,
      # and the version is named from the digest, so a sha tag pushed over in
      # between can't slip in. The digests go in the Release notes.
      # ADR-086: the provenance is downloaded first and verified from that
      # file, and only the bundles that passed are attached to the Release.
      - name: Verify and name the images
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ runner.temp }}/release-notes.md
          ASSETS: ${{ runner.temp }}/assets
          SIGNER: https://github.com/${{ github.repository }}/.github/workflows/deploy.yml@refs/heads/main
        run: |
          set -euo pipefail
          sha="sha-$(git rev-parse --short=7 HEAD)"
          mkdir -p "$ASSETS"
          declare -A digests
          for image in echoandaura-web echoandaura-worker; do
            digest="$(docker buildx imagetools inspect "$REGISTRY/$image:$sha" --format '{{json .Manifest}}' | jq -r .digest)"
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] \
              || { echo "::error::$image:$sha did not resolve to a digest (got '$digest')"; exit 1; }
            # One Sigstore bundle per line; a re-run Deploy adds a line.
            # gh names the file after the digest, in the current directory.
            downloaded="$RUNNER_TEMP/$digest.jsonl"
            (cd "$RUNNER_TEMP" && gh attestation download "oci://$REGISTRY/$image@$digest" \
              --repo "$GITHUB_REPOSITORY" \
              --predicate-type https://slsa.dev/provenance/v1)
            [ -s "$downloaded" ] \
              || { echo "::error::$image@$digest has no provenance to download"; exit 1; }
            # Verify passes if any one line passes, so only the lines it
            # verified are kept: every bundle attached passed this policy.
            bundle="$ASSETS/$image-$GITHUB_REF_NAME.intoto.jsonl"
            gh attestation verify "oci://$REGISTRY/$image@$digest" \
              --bundle "$downloaded" \
              --repo "$GITHUB_REPOSITORY" \
              --cert-identity "$SIGNER" \
              --deny-self-hosted-runners \
              --source-ref refs/heads/main \
              --source-digest "$GITHUB_SHA" \
              --format json \
              | jq -c '.[].attestation.bundle' > "$bundle"
            [ -s "$bundle" ] \
              || { echo "::error::$image@$digest has no verified provenance to attach"; exit 1; }
            # The images are pushed as a one-platform index, so the config
            # is keyed by platform; a plain manifest has it at the top.
            revision="$(docker buildx imagetools inspect "$REGISTRY/$image@$digest" --format '{{json .Image}}' \
              | jq -r '(if has("config") then . else .["linux/amd64"] end).config.Labels["org.opencontainers.image.revision"] // ""')"
            [ "$revision" = "$GITHUB_SHA" ] \
              || { echo "::error::$image@$digest was built from '$revision', not $GITHUB_SHA"; exit 1; }
            digests[$image]="$digest"
          done
          {
            echo
            echo '## Images'
            echo
            echo 'Built, scanned and signed by the Deploy workflow (ADR-075). Check one by'
            echo 'its digest below (DEPLOY.md → Checking where an image came from):'
            echo
            echo '```sh'
            echo "gh attestation verify oci://<image>@<digest> --repo $GITHUB_REPOSITORY \\"
            echo "  --cert-identity $SIGNER --deny-self-hosted-runners"
            echo '```'
            echo
            echo 'The signed provenance of each image is attached below as'
            echo '`<image>-<version>.intoto.jsonl`. Adding `--bundle <file>` checks the'
            echo 'image against that file; without it, the check also confirms the'
            echo 'repository is still this one, not a later holder of its name.'
            echo
          } >> "$NOTES"
          for image in echoandaura-web echoandaura-worker; do
            digest="${digests[$image]}"
            docker buildx imagetools create \
              -t "$REGISTRY/$image:$GITHUB_REF_NAME" "$REGISTRY/$image@$digest"
            echo "- \`$REGISTRY/$image@$digest\`" >> "$NOTES"
          done

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        # The CHANGELOG section first; gh appends the generated PR list.
        # The provenance files go up with the Release, never after it
        # (OpenSSF Signed-Releases, ADR-086).
        run: >-
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME"
          --notes-file "$RUNNER_TEMP/release-notes.md" --generate-notes
          "$RUNNER_TEMP/assets/echoandaura-web-$GITHUB_REF_NAME.intoto.jsonl"
          "$RUNNER_TEMP/assets/echoandaura-worker-$GITHUB_REF_NAME.intoto.jsonl"
