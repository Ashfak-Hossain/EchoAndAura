name: Release

# ADR-041. A version tag (vX.Y.Z) on a commit that main has already built
# and deployed. Deploys stay continuous from main (ADR-036): a tag marks a
# milestone and deploys nothing. It does two things:
#   - names that commit's images with the version, so a rollback can pin
#     IMAGE_TAG=v1.0.0 (DEPLOY.md → Rolling back);
#   - publishes the GitHub Release: the tag's CHANGELOG.md section, then the
#     notes GitHub generates from the merged PRs (.github/release.yml).
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io/ashfak-hossain

jobs:
  release:
    # Pinned like CI (ci.yml → verify): ubuntu-latest moves to Ubuntu 26.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Only what main shipped gets a version: its images exist, and CI
      # was green on it.
      - name: The tag is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      # Before anything is named: the version needs its CHANGELOG.md section,
      # and package.json must carry the same version.
      - name: Release notes
        run: node .github/scripts/release-notes.mjs "$GITHUB_REF_NAME" > "$RUNNER_TEMP/release-notes.md"

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A new name for the existing images: nothing is rebuilt, so the
      # version runs exactly what production ran. Fails if the Deploy
      # workflow never built this commit.
      - name: Name the images with the version
        run: |
          set -euo pipefail
          sha="sha-$(git rev-parse --short=7 HEAD)"
          for image in echoandaura-web echoandaura-worker; do
            docker buildx imagetools create \
              -t "$REGISTRY/$image:$GITHUB_REF_NAME" "$REGISTRY/$image:$sha"
          done

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        # The CHANGELOG section first; gh appends the generated PR list.
        run: >-
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME"
          --notes-file "$RUNNER_TEMP/release-notes.md" --generate-notes
