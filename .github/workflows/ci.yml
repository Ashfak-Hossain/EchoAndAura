name: CI

on:
  push:
    branches: [main]
  pull_request:

# CI only reads the code: its token gets nothing else, so a compromised
# dependency or step cannot push, tag or touch releases (CodeQL
# actions/missing-workflow-permissions).
permissions:
  contents: read

jobs:
  verify:
    # Pinned, not ubuntu-latest: that label moves to Ubuntu 26 from
    # 2026-10-19, and an OS change should be its own PR (DEVELOPMENT.md →
    # Dependencies). Same pin in every workflow.
    runs-on: ubuntu-24.04

    # Postgres + Redis are provisioned for the integration suite. The default
    # gate (`pnpm verify`) does not use them; the Postgres-only integration
    # subset (inventory — including the concurrency test) runs after it. The
    # storage integration test needs MinIO, which has no `services:` entry
    # (its image needs a command), so it stays local-only for now.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: echoandaura
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: echoandaura
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U echoandaura -d echoandaura"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      DATABASE_URL: postgresql://echoandaura:ci_password@localhost:5432/echoandaura
      TEST_DATABASE_URL: postgresql://echoandaura:ci_password@localhost:5432/echoandaura
      REDIS_URL: redis://localhost:6379
      # `next build` (inside `pnpm verify`) loads every route, and the auth
      # module refuses to load without these (fail fast at boot). CI has no
      # .env, so the build failed on main from 2026-09-19 until this was
      # added. Fake, CI-only values, like ci_password above; the Dockerfile's
      # build stage does the same.
      BETTER_AUTH_URL: http://localhost:3000
      BETTER_AUTH_SECRET: ci-only-placeholder-never-used-outside-ci-000000

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm verify

      # THE most important test in the repo (CLAUDE.md § Testing) runs here,
      # with the gate check-in race tests (ADR-030) — both need only Postgres.
      - run: pnpm db:migrate
      - run: pnpm test:integration:db

  # Terraform (ADR-062): format, validity and lint for both root modules.
  # No credentials and no backend: it reads the code only, so it can never
  # plan or change anything at Cloudflare or AWS. Plan and apply stay on a
  # person's laptop (docs/infra/TERRAFORM.md).
  terraform:
    runs-on: ubuntu-24.04

    strategy:
      matrix:
        module: [aws, cloudflare]

    defaults:
      run:
        working-directory: ops/terraform/${{ matrix.module }}

    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.15.6
          terraform_wrapper: false

      - uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: v0.64.0

      - run: terraform fmt -check -diff

      # -backend=false: never touch the S3 state. Providers come from the
      # committed lock file (linux_amd64 checksums included).
      - run: terraform init -backend=false -input=false -lockfile=readonly

      - run: terraform validate

      # Built-in rules only (.tflint.hcl): nothing to download, no token.
      - run: tflint --config="$GITHUB_WORKSPACE/ops/terraform/.tflint.hcl" --format=compact

  # Ansible (ADR-063): ansible-lint (production profile) and a syntax check.
  # No inventory secrets and no SSH key: it never reaches the server.
  # Check mode and applies stay on a person's laptop (docs/infra/ANSIBLE.md).
  ansible:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      # Exact version: setup-uv publishes no moving major tag (no `v10`).
      # Dependabot (github-actions) bumps it.
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: ops/ansible/uv.lock

      # The playbook reads the operator's public key; CI has none, and
      # lint and syntax check never need its contents.
      - run: ops/ansible/run.sh lint
