name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    # Postgres + Redis are provisioned for the integration suite. The default
    # gate (`pnpm verify`) does not use them yet; the integration step below is
    # commented out until Phase 3 lands the reservation logic and the
    # concurrency test goes green.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: echoandaura
          POSTGRES_PASSWORD: local_dev_only_change_me
          POSTGRES_DB: echoandaura
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U echoandaura -d echoandaura"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      DATABASE_URL: postgresql://echoandaura:local_dev_only_change_me@localhost:5432/echoandaura
      TEST_DATABASE_URL: postgresql://echoandaura:local_dev_only_change_me@localhost:5432/echoandaura
      REDIS_URL: redis://localhost:6379

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm verify

      # Enable in Phase 3, when reserveTicketInventory is implemented and the
      # concurrency test passes:
      # - run: pnpm db:migrate
      # - run: pnpm test:integration
