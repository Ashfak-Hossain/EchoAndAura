name: CI

on:
  push:
    branches: [main]
  pull_request:

# CI only reads the code: its token gets nothing else, so a compromised
# dependency or step cannot push, tag or touch releases (CodeQL
# actions/missing-workflow-permissions).
permissions:
  contents: read

jobs:
  verify:
    # Pinned, not ubuntu-latest: that label moves to Ubuntu 26 from
    # 2026-10-19, and an OS change should be its own PR (DEVELOPMENT.md →
    # Dependencies). Same pin in every workflow.
    runs-on: ubuntu-24.04

    # One job, so the required `verify` check always reports pass or fail,
    # never "skipped" (which would block merging). ADR-071: steps run by what
    # the change touches. Typecheck, lint and unit tests always run; the app
    # part and the docs part are skipped only when no changed path can affect
    # them. Together the parts are exactly `pnpm verify` (a test keeps them in
    # step) plus the browser, Postgres and docs-export gates.
    env:
      DATABASE_URL: postgresql://echoandaura:ci_password@localhost:5432/echoandaura
      TEST_DATABASE_URL: postgresql://echoandaura:ci_password@localhost:5432/echoandaura
      REDIS_URL: redis://localhost:6379
      # `next build` loads every route, and the auth module refuses to load
      # without these (fail fast at boot). CI has no .env, so the build failed
      # on main from 2026-09-19 until this was added. Fake, CI-only values,
      # like ci_password above; the Dockerfile's build stage does the same.
      BETTER_AUTH_URL: http://localhost:3000
      BETTER_AUTH_SECRET: ci-only-placeholder-never-used-outside-ci-000000

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # A PR into main is compared with its base. A push to main runs everything: a
      # green main run is what deploys (ADR-067) and publishes the docs. Any
      # doubt (no base, unknown path, empty diff) runs everything.
      - name: Select checks
        id: select
        run: node .github/scripts/ci-select.mjs
        env:
          CI_EVENT: ${{ github.event_name }}
          CI_BASE_REF: ${{ github.event.pull_request.base.ref }}
          CI_BASE: ${{ github.event.pull_request.base.sha }}
          CI_HEAD: ${{ github.sha }}

      # Started early so the images pull while dependencies install. Plain
      # containers instead of `services:`, which would start on every run.
      # Postgres serves the integration suite (inventory — including the
      # concurrency test). The storage test needs MinIO and stays local-only.
      - name: Start Postgres and Redis
        if: steps.select.outputs.app != 'false'
        run: |
          docker run -d --name postgres -p 5432:5432 \
            -e POSTGRES_USER=echoandaura -e POSTGRES_PASSWORD=ci_password -e POSTGRES_DB=echoandaura \
            --health-cmd "pg_isready -U echoandaura -d echoandaura" \
            --health-interval 2s --health-timeout 5s --health-retries 30 postgres:17
          docker run -d --name redis -p 6379:6379 \
            --health-cmd "redis-cli ping" \
            --health-interval 2s --health-timeout 5s --health-retries 30 redis:7

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

      - run: pnpm build
        if: steps.select.outputs.app != 'false'

      - run: pnpm docs:verify
        if: steps.select.outputs.docs != 'false'

      - run: pnpm exec playwright install --with-deps chromium
        if: steps.select.outputs.docs != 'false'
      - run: pnpm docs:test
        if: steps.select.outputs.docs != 'false'
      - name: Test Pages static hosting behavior locally
        if: steps.select.outputs.docs != 'false'
        run: pnpm docs:test
        env:
          DOCS_PREVIEW_MODE: pages
          WRANGLER_SEND_METRICS: 'false'

      - name: Wait for Postgres and Redis
        if: steps.select.outputs.app != 'false'
        run: |
          for container in postgres redis; do
            for _ in $(seq 1 60); do
              [ "$(docker inspect -f '{{.State.Health.Status}}' "$container")" = healthy ] && break
              sleep 1
            done
            test "$(docker inspect -f '{{.State.Health.Status}}' "$container")" = healthy
          done

      # THE most important test in the repo (CLAUDE.md § Testing) runs here,
      # with the gate check-in race tests (ADR-030) — both need only Postgres.
      - run: pnpm db:migrate
        if: steps.select.outputs.app != 'false'
      - run: pnpm test:integration:db
        if: steps.select.outputs.app != 'false'

      # Only checked static output, never the repo, .env or app build. No
      # Cloudflare credentials in CI. The publisher treats this as data.
      - name: Package docs export
        if: steps.select.outputs.docs != 'false'
        run: node .github/scripts/docs-artifact.mjs package "$RUNNER_TEMP/docs-artifact"
        env:
          DOCS_RUN_ID: ${{ github.run_id }}
          DOCS_RUN_ATTEMPT: ${{ github.run_attempt }}
          DOCS_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

      # ADR-071: no docs build, so nothing to publish. The publisher accepts
      # this marker in place of an export; neither, or both, is still an error.
      - name: Mark docs unaffected
        if: steps.select.outputs.docs == 'false'
        run: |
          mkdir -p "$RUNNER_TEMP/docs-unchanged"
          printf 'Docs unaffected by this change (ADR-071): %s\n' "$REASON" \
            > "$RUNNER_TEMP/docs-unchanged/docs-unchanged.txt"
        env:
          REASON: ${{ steps.select.outputs.reason }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.select.outputs.docs == 'false'
        with:
          name: docs-unchanged-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/docs-unchanged
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.select.outputs.docs != 'false'
        with:
          name: docs-site-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/docs-artifact
          if-no-files-found: error
          retention-days: 7

  # Terraform (ADR-062): format, validity and lint for both root modules.
  # No credentials and no backend: it reads the code only, so it can never
  # plan or change anything at Cloudflare or AWS. Plan and apply stay on a
  # person's laptop (docs/infra/TERRAFORM.md).
  terraform:
    runs-on: ubuntu-24.04

    strategy:
      matrix:
        module: [aws, cloudflare]

    defaults:
      run:
        working-directory: ops/terraform/${{ matrix.module }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.6
          terraform_wrapper: false

      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: v0.64.0

      - run: terraform fmt -check -diff

      # -backend=false: never touch the S3 state. Providers come from the
      # committed lock file (linux_amd64 checksums included).
      - run: terraform init -backend=false -input=false -lockfile=readonly

      - run: terraform validate

      # Built-in rules only (.tflint.hcl): nothing to download, no token.
      - run: tflint --config="$GITHUB_WORKSPACE/ops/terraform/.tflint.hcl" --format=compact

  # Ansible (ADR-063): ansible-lint (production profile) and a syntax check.
  # No inventory secrets and no SSH key: it never reaches the server.
  # Check mode and applies stay on a person's laptop (docs/infra/ANSIBLE.md).
  ansible:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Exact version: setup-uv publishes no moving major tag (no `v10`).
      # Dependabot (github-actions) bumps it.
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: ops/ansible/uv.lock

      # The playbook reads the operator's public key; CI has none, and
      # lint and syntax check never need its contents.
      - run: ops/ansible/run.sh lint
