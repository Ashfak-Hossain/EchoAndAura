name: CI

on:
  push:
    branches: [main]
  pull_request:

# CI only reads the code: its token gets nothing else, so a compromised
# dependency or step cannot push, tag or touch releases (CodeQL
# actions/missing-workflow-permissions).
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    # Postgres + Redis are provisioned for the integration suite. The default
    # gate (`pnpm verify`) does not use them; the Postgres-only integration
    # subset (inventory — including the concurrency test) runs after it. The
    # storage integration test needs MinIO, which has no `services:` entry
    # (its image needs a command), so it stays local-only for now.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: echoandaura
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: echoandaura
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U echoandaura -d echoandaura"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      DATABASE_URL: postgresql://echoandaura:ci_password@localhost:5432/echoandaura
      TEST_DATABASE_URL: postgresql://echoandaura:ci_password@localhost:5432/echoandaura
      REDIS_URL: redis://localhost:6379
      # `next build` (inside `pnpm verify`) loads every route, and the auth
      # module refuses to load without these (fail fast at boot). CI has no
      # .env, so the build failed on main from 2026-09-19 until this was
      # added. Fake, CI-only values, like ci_password above; the Dockerfile's
      # build stage does the same.
      BETTER_AUTH_URL: http://localhost:3000
      BETTER_AUTH_SECRET: ci-only-placeholder-never-used-outside-ci-000000

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm verify

      # THE most important test in the repo (CLAUDE.md § Testing) runs here,
      # with the gate check-in race tests (ADR-030) — both need only Postgres.
      - run: pnpm db:migrate
      - run: pnpm test:integration:db
