name: Deploy

# ADR-036/067: after CI passes on main, compare the confirmed running revision
# with the candidate. Runtime changes build the two production images on
# GitHub's machines, smoke-test them, push them to GHCR, and tell Dokploy to
# pull and restart. Known non-runtime-only changes stop after selection. The
# VPS never builds anything.
#
# Inert until configured (docs/DEPLOY.md § One-time setup):
#   repo variable R2_PUBLIC_URL      — no images are built without it
#   repo secrets  DOKPLOY_URL, DOKPLOY_API_KEY, DOKPLOY_COMPOSE_ID
#                                    — images are pushed but not deployed without them
#   repo secrets  CF_ACCESS_CLIENT_ID, CF_ACCESS_CLIENT_SECRET
#                                    — the Access service token for the deploy
#                                      host (ADR-050); sent when set
#
# Manual run (Actions → Deploy → Run workflow): rebuild and redeploy main.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# One deploy at a time; a newer one waits rather than racing it.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions: {}

env:
  REGISTRY: ghcr.io/ashfak-hossain
  # ADR-069: the image scanner, pinned by digest (the same digest on Docker Hub
  # and public ECR). Bumped by hand: docs/DEVELOPMENT.md → Dependencies.
  TRIVY_IMAGE: docker.io/aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa

jobs:
  selection:
    # The selector is deliberately credential-free. If it cannot prove that
    # every change since the healthy running revision is non-runtime, it keeps
    # the existing behavior and selects a full image deployment.
    if: >-
      vars.R2_PUBLIC_URL != '' &&
      ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push'))
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      deploy: ${{ steps.selection.outputs.deploy }}
      reason: ${{ steps.selection.outputs.reason }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          # The live baseline can be many merges behind main. A shallow diff
          # could falsely call an application change docs-only.
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Select application deployment
        id: selection
        run: node .github/scripts/deploy-select.mjs
        env:
          DEPLOYMENT_EVENT: ${{ github.event_name }}
          DEPLOYMENT_CANDIDATE: ${{ github.event.workflow_run.head_sha || github.sha }}
          DEPLOYMENT_URL: https://echoandaura.com/api/deployment

  images:
    # Only the credential-free selection job can admit this job. Manual runs
    # from main always select it; automatic runs may skip when the complete
    # confirmed-baseline diff contains no production-image input.
    needs: selection
    # ADR-075: the signed provenance names github.sha, which on workflow_run
    # is main's newest commit when CI finished, not always the commit CI
    # passed. The selector already skips a run main has moved past
    # (stale_candidate); this repeats it where the images are built, so no
    # image is ever signed with another commit's name.
    if: >-
      needs.selection.outputs.deploy == 'true' &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.head_sha == github.sha)
    # Pinned like CI (ci.yml → verify): ubuntu-latest moves to Ubuntu 26.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    # For the attest job, which signs what this job pushed (ADR-075).
    outputs:
      web-digest: ${{ steps.digests.outputs.web }}
      worker-digest: ${{ steps.digests.outputs.worker }}

    # For the smoke test: the images must boot against a real Postgres + Redis.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: smoke
          POSTGRES_PASSWORD: smoke
          POSTGRES_DB: smoke
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U smoke -d smoke"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The commit CI just passed, not whatever main is now.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Tags
        id: tags
        run: |
          echo "sha=sha-$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build web
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: web
          load: true
          build-args: |
            R2_PUBLIC_URL=${{ vars.R2_PUBLIC_URL }}
            SOURCE_REVISION=${{ steps.tags.outputs.revision }}
            NEXT_PUBLIC_SENTRY_DSN=${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
            SENTRY_ORG=${{ vars.SENTRY_ORG }}
            SENTRY_PROJECT=${{ vars.SENTRY_PROJECT }}
            SENTRY_BUILD_SOURCEMAPS=${{ vars.SENTRY_BUILD_SOURCEMAPS || '0' }}
          secrets: |
            sentry_auth_token=${{ secrets.SENTRY_AUTH_TOKEN }}
          tags: |
            ${{ env.REGISTRY }}/echoandaura-web:${{ steps.tags.outputs.sha }}
            ${{ env.REGISTRY }}/echoandaura-web:main
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

      - name: Build worker
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: worker
          load: true
          build-args: |
            R2_PUBLIC_URL=${{ vars.R2_PUBLIC_URL }}
            SOURCE_REVISION=${{ steps.tags.outputs.revision }}
            NEXT_PUBLIC_SENTRY_DSN=${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
            SENTRY_ORG=${{ vars.SENTRY_ORG }}
            SENTRY_PROJECT=${{ vars.SENTRY_PROJECT }}
            SENTRY_BUILD_SOURCEMAPS=${{ vars.SENTRY_BUILD_SOURCEMAPS || '0' }}
          secrets: |
            sentry_auth_token=${{ secrets.SENTRY_AUTH_TOKEN }}
          tags: |
            ${{ env.REGISTRY }}/echoandaura-worker:${{ steps.tags.outputs.sha }}
            ${{ env.REGISTRY }}/echoandaura-worker:main
          cache-from: type=gha,scope=worker
          cache-to: type=gha,scope=worker,mode=max

      # ADR-069: fail on critical vulnerabilities that have a fix; list the
      # high ones without failing. Trivy runs as its own container reading a
      # `docker save` export: no Docker socket, and none of this job's secrets
      # in its environment (CVE-2026-33634 hijacked Trivy's GitHub Actions to
      # read runner memory). Accepted exceptions live in .trivyignore.yaml.
      # ADR-075: the same export also gives each image's SBOM (SPDX), so the
      # package list is of exactly what was scanned and is pushed.
      - name: Scan images
        env:
          WEB: ${{ env.REGISTRY }}/echoandaura-web:${{ steps.tags.outputs.sha }}
          WORKER: ${{ env.REGISTRY }}/echoandaura-worker:${{ steps.tags.outputs.sha }}
          SBOM_DIR: ${{ runner.temp }}/sbom
        run: |
          set -euo pipefail
          trap 'rm -f image.tar' EXIT
          mkdir -p "$SBOM_DIR"
          sbom() {
            docker run --rm \
              -v "$PWD/image.tar:/scan/image.tar:ro" \
              -v "$SBOM_DIR:/sbom" \
              -v trivy-cache:/root/.cache \
              "$TRIVY_IMAGE" image --input /scan/image.tar --format spdx-json \
              --no-progress --output "/sbom/$1.spdx.json"
          }
          scan() {
            docker run --rm \
              -v "$PWD/image.tar:/scan/image.tar:ro" \
              -v "$PWD/.trivyignore.yaml:/scan/.trivyignore.yaml:ro" \
              -v trivy-cache:/root/.cache \
              "$TRIVY_IMAGE" image --input /scan/image.tar --scanners vuln \
              --ignore-unfixed --ignorefile /scan/.trivyignore.yaml --no-progress \
              --db-repository mirror.gcr.io/aquasec/trivy-db:2,public.ecr.aws/aquasecurity/trivy-db:2,ghcr.io/aquasecurity/trivy-db:2 \
              "$@"
          }
          for name in web worker; do
            if [ "$name" = web ]; then image="$WEB"; else image="$WORKER"; fi
            echo "::group::Scan $image"
            docker save "$image" -o image.tar
            scan --severity HIGH --exit-code 0
            scan --severity CRITICAL --exit-code 1
            sbom "$name"
            echo "::endgroup::"
          done
          test -s "$SBOM_DIR/web.spdx.json"
          test -s "$SBOM_DIR/worker.spdx.json"

      # The images that will run in production, booted for real: every
      # migration from an empty database, the web server answering its
      # health check (which includes the worker's heartbeat, ADR-040) and
      # the home page, the worker staying up.
      - name: Smoke test
        env:
          WEB: ${{ env.REGISTRY }}/echoandaura-web:${{ steps.tags.outputs.sha }}
          WORKER: ${{ env.REGISTRY }}/echoandaura-worker:${{ steps.tags.outputs.sha }}
        run: |
          set -euo pipefail
          cat > smoke.env <<'EOF'
          APP_ENV=production
          DATABASE_URL=postgresql://smoke:smoke@127.0.0.1:5432/smoke
          REDIS_URL=redis://127.0.0.1:6379
          SITE_URL=http://127.0.0.1:3000
          BETTER_AUTH_URL=http://127.0.0.1:3000
          BETTER_AUTH_SECRET=smoke-test-secret-not-used-anywhere-else-0123456789
          R2_ENDPOINT=http://127.0.0.1:9000
          R2_ACCESS_KEY_ID=smoke
          R2_SECRET_ACCESS_KEY=smoke
          R2_BUCKET=smoke
          R2_PUBLIC_URL=http://127.0.0.1:9000/smoke
          MAILER=ses
          AWS_SES_REGION=ap-south-1
          AWS_SES_ACCESS_KEY_ID=AKIAIOSFODNN7EXAMPLE
          AWS_SES_SECRET_ACCESS_KEY=wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
          EMAIL_FROM=smoke <smoke@example.com>
          EOF
          docker run --rm --network host --env-file smoke.env "$WORKER" node dist/ops/migrate.mjs
          docker run -d --name web --network host --env-file smoke.env "$WEB"
          docker run -d --name worker --network host --env-file smoke.env "$WORKER"
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:3000/api/health && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:3000/api/health | grep -q '"ok":true'
          # What the container's own HEALTHCHECK asks (Traefik routes on it).
          curl -fsS 'http://127.0.0.1:3000/api/health?live' | grep -q '"ok":true'
          curl -fsS -o /dev/null http://127.0.0.1:3000/
          curl -fsS -o /dev/null http://127.0.0.1:3000/door/sw.js
          sleep 5
          test "$(docker inspect -f '{{.State.Running}}' worker)" = true
          DEPLOYMENT_URL=http://127.0.0.1:3000/api/deployment \
          DEPLOYMENT_REVISION="${{ steps.tags.outputs.revision }}" \
          DEPLOYMENT_TIMEOUT_MS=90000 node .github/scripts/deploy-confirm.mjs
        # The worker boots with the production mailer (it refuses any other)
        # on AWS's documented example keys: the right shape (the worker checks
        # it at boot), valid nowhere. An empty database queues no email, so
        # none is sent. It also refuses to boot without the ticket fonts.

      - name: Container logs (on failure)
        if: failure()
        run: |
          docker logs web || true
          docker logs worker || true

      # Before the push, so the attest job has the SBOMs even if pushing the
      # second image fails after the first is on GHCR.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: ${{ runner.temp }}/sbom/
          if-no-files-found: error
          retention-days: 90

      # ADR-075: a tag can be pushed over; a digest names one image forever.
      # The digest signed is the one GHCR acknowledged for this push, and it
      # must still be what the tag resolves to when read back: if anything
      # pushed over the tag in between, the job fails instead of signing.
      - name: Push
        id: digests
        run: |
          set -euo pipefail
          for name in web worker; do
            image="$REGISTRY/echoandaura-$name"
            pushed="$(docker push "$image:${{ steps.tags.outputs.sha }}" | tee /dev/stderr \
              | sed -n 's/.*digest: \(sha256:[0-9a-f]\{64\}\).*/\1/p' | tail -n 1)"
            [[ "$pushed" =~ ^sha256:[0-9a-f]{64}$ ]] \
              || { echo "::error::no digest in the push output for $image"; exit 1; }
            docker push "$image:main"
            digest="$(docker buildx imagetools inspect "$image:${{ steps.tags.outputs.sha }}" --format '{{json .Manifest}}' | jq -r .digest)"
            [ "$digest" = "$pushed" ] \
              || { echo "::error::$image:${{ steps.tags.outputs.sha }} resolves to '$digest', but the push was $pushed"; exit 1; }
            echo "$name=$digest" >> "$GITHUB_OUTPUT"
            echo "::notice::echoandaura-$name@$digest"
          done

      - name: Deploy
        id: deploy
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_COMPOSE_ID: ${{ secrets.DOKPLOY_COMPOSE_ID }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          echo "requested=false" >> "$GITHUB_OUTPUT"
          if [ -z "$DOKPLOY_URL" ] || [ -z "$DOKPLOY_API_KEY" ] || [ -z "$DOKPLOY_COMPOSE_ID" ]; then
            echo "::notice::Images pushed; Dokploy is not configured yet, so nothing was deployed."
            exit 0
          fi
          # ADR-050: Cloudflare Access guards the deploy host; a script
          # passes it with the service token instead of an email code.
          access=()
          if [ -n "$CF_ACCESS_CLIENT_ID" ] && [ -n "$CF_ACCESS_CLIENT_SECRET" ]; then
            access=(-H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET")
          fi
          curl -fsS -o /dev/null -X POST "$DOKPLOY_URL/api/compose.deploy" \
            "${access[@]}" \
            -H "x-api-key: $DOKPLOY_API_KEY" \
            -H 'Content-Type: application/json' \
            -d "{\"composeId\":\"$DOKPLOY_COMPOSE_ID\"}"
          echo "::notice::Deploy of ${{ steps.tags.outputs.sha }} requested — watch it in Dokploy."
          echo "requested=true" >> "$GITHUB_OUTPUT"

      # No deployment credentials in this read-only step. A green HTTP request
      # to Dokploy is not proof that the expected images actually started.
      - name: Confirm the running web and worker revision
        if: steps.deploy.outputs.requested == 'true'
        run: node .github/scripts/deploy-confirm.mjs
        env:
          DEPLOYMENT_URL: https://echoandaura.com/api/deployment
          DEPLOYMENT_REVISION: ${{ steps.tags.outputs.revision }}

  # ADR-075: signed records of how each pushed image was built (SLSA
  # provenance: this workflow, this run, this commit) and what is in it (the
  # SBOM). `gh attestation verify oci://<image>@<digest> --repo <repo>` checks
  # them; the Release workflow refuses to version an image without one.
  # A job of its own so the signing token (id-token) never shares a runner
  # with the build, the scanner or the Sentry and deploy secrets. It runs
  # whenever an image was pushed, even if a later step of that job failed
  # (each image on its own: a failed second push leaves the first signed),
  # so nothing on GHCR goes unsigned.
  attest:
    needs: images
    if: ${{ !cancelled() && (needs.images.outputs.web-digest != '' || needs.images.outputs.worker-digest != '') }}
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
      attestations: write
    env:
      WEB: ghcr.io/ashfak-hossain/echoandaura-web
      WORKER: ghcr.io/ashfak-hossain/echoandaura-worker
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sbom
          path: ${{ runner.temp }}/sbom

      # Kept in GitHub's attestation store, not pushed to GHCR: this job has
      # no packages: write.
      - name: Provenance, web
        if: needs.images.outputs.web-digest != ''
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.WEB }}
          subject-digest: ${{ needs.images.outputs.web-digest }}
          create-storage-record: false

      - name: Provenance, worker
        if: needs.images.outputs.worker-digest != ''
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.WORKER }}
          subject-digest: ${{ needs.images.outputs.worker-digest }}
          create-storage-record: false

      - name: SBOM, web
        if: needs.images.outputs.web-digest != ''
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.WEB }}
          subject-digest: ${{ needs.images.outputs.web-digest }}
          sbom-path: ${{ runner.temp }}/sbom/web.spdx.json
          create-storage-record: false

      - name: SBOM, worker
        if: needs.images.outputs.worker-digest != ''
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.WORKER }}
          subject-digest: ${{ needs.images.outputs.worker-digest }}
          sbom-path: ${{ runner.temp }}/sbom/worker.spdx.json
          create-storage-record: false
