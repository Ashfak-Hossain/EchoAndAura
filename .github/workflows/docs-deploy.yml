name: Publish docs

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read
  actions: read
  pull-requests: read

# Serialize uploads. An old run is checked again just before publishing;
# cancelling a running upload is not a rollback.
concurrency:
  group: docs-pages
  cancel-in-progress: false

jobs:
  select:
    if: vars.DOCS_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-24.04
    outputs:
      publish: ${{ steps.release.outputs.publish }}
      branch: ${{ steps.release.outputs.branch }}
      environment: ${{ steps.release.outputs.environment }}
      sha: ${{ steps.release.outputs.sha }}
      artifact: ${{ steps.release.outputs.artifact }}
      attempt: ${{ steps.release.outputs.attempt }}
    steps:
      # workflow_run's SHA is trusted default-branch code, NOT the PR SHA.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - id: release
        run: node .github/scripts/docs-release.mjs
        env:
          GH_TOKEN: ${{ github.token }}

  publish:
    needs: select
    if: needs.select.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    # Configure the two environments first. Preview approval is recommended;
    # Pages previews are public and this account token is not project-scoped.
    environment: ${{ needs.select.outputs.environment }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.select.outputs.artifact }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/docs-artifact
          merge-multiple: true
      - name: Validate static data with trusted code
        run: node .github/scripts/docs-artifact.mjs validate "$RUNNER_TEMP/docs-artifact"
        env:
          DOCS_RUN_ID: ${{ github.event.workflow_run.id }}
          DOCS_RUN_ATTEMPT: ${{ needs.select.outputs.attempt }}
          DOCS_HEAD_SHA: ${{ needs.select.outputs.sha }}
      # Isolated tooling, never pnpm install or build in the artifact/PR tree.
      # Install before the only step that receives Cloudflare credentials.
      - name: Install the pinned uploader
        run: npm install --prefix "$RUNNER_TEMP/docs-tools" --ignore-scripts --no-audit --no-fund wrangler@4.147.0
      - name: Recheck current main or open PR after any approval delay
        id: current
        run: node .github/scripts/docs-release.mjs
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Upload checked files only
        if: steps.current.outputs.publish == 'true' && steps.current.outputs.sha == needs.select.outputs.sha && steps.current.outputs.artifact == needs.select.outputs.artifact && steps.current.outputs.branch == needs.select.outputs.branch
        working-directory: ${{ runner.temp }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Configure the docs environment credentials before publishing.'; exit 1; }
          node "$GITHUB_WORKSPACE/.github/scripts/docs-project.mjs"
          "$RUNNER_TEMP/docs-tools/node_modules/.bin/wrangler" pages deploy "$RUNNER_TEMP/docs-artifact/site" --project-name=echoandaura-docs --branch="$DOCS_BRANCH" --commit-hash="$DOCS_SHA" --commit-message="Checked docs publication" --commit-dirty=false
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DOCS_BRANCH: ${{ needs.select.outputs.branch }}
          DOCS_SHA: ${{ needs.select.outputs.sha }}
          WRANGLER_SEND_METRICS: 'false'
