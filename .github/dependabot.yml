# Dependency updates (see docs/DEVELOPMENT.md → Dependencies). Versions stay
# pinned exactly: Dependabot moves the pin, it never adds a range. Minor and
# patch bumps come as one grouped PR per ecosystem per week; majors come one
# by one, because each needs its own reading of the upgrade notes.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: sunday
      time: '04:00'
      timezone: Asia/Dhaka
    open-pull-requests-limit: 5
    labels: [dependencies]
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: sunday
      time: '04:00'
      timezone: Asia/Dhaka
    labels: [dependencies, ci]
    groups:
      actions:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: sunday
      time: '04:00'
      timezone: Asia/Dhaka
    labels: [dependencies, infra]
