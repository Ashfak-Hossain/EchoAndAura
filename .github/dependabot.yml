# Dependency updates (see docs/DEVELOPMENT.md → Dependencies). Versions stay
# pinned exactly: Dependabot moves the pin, it never adds a range. Minor and
# patch bumps come as one grouped PR per ecosystem per week; majors come one
# by one, because each needs its own reading of the upgrade notes.
version: 2
updates:
  # Two manifests, one PR per group: the docs uploader (.github/docs-tools,
  # ADR-084) moves with the app's own wrangler.
  - package-ecosystem: npm
    directories: [/, /.github/docs-tools]
    schedule:
      interval: weekly
      day: sunday
      time: '04:00'
      timezone: Asia/Dhaka
    open-pull-requests-limit: 5
    labels: [dependencies]
    ignore:
      # The door scanner runs the zxing-wasm that barcode-detector pins
      # exactly; the build copies its .wasm to public/vendor/. It moves only
      # with barcode-detector, by hand (docs/DEVELOPMENT.md → Dependencies).
      - dependency-name: zxing-wasm
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  # Actions are pinned by commit SHA with the version as a comment (ADR-073).
  # Dependabot reads the `# vX.Y.Z` comment and moves the SHA and the comment
  # together; tests/unit/actions-pinned.test.ts refuses anything else.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: sunday
      time: '04:00'
      timezone: Asia/Dhaka
    labels: [dependencies, ci]
    groups:
      actions:
        update-types: [minor, patch]

  # ADR-081: both Dockerfiles use literal, digest-pinned FROM references.
  # Group Node across the directories so a bump cannot leave production
  # and the dev container on different images (devcontainer.test.ts).
  - package-ecosystem: docker
    directories: [/, /.devcontainer]
    schedule:
      interval: weekly
      day: sunday
      time: '04:00'
      timezone: Asia/Dhaka
    labels: [dependencies, infra]
    groups:
      node:
        patterns: [node]

  # Dev container features (ADR-080): moves the exact version in
  # devcontainer.json and the digest in devcontainer-lock.json together.
  - package-ecosystem: devcontainers
    directory: /
    schedule:
      interval: weekly
      day: sunday
      time: '04:00'
      timezone: Asia/Dhaka
    labels: [dependencies, infra]
    groups:
      features:
        update-types: [minor, patch]

  # Terraform providers (ADR-062): moves the exact `version` pin in
  # versions.tf and the lock file. Not Terraform itself (required_version,
  # CI's terraform_version): that is a by-hand upgrade. CI only proves the
  # code still validates; after merging, run `pnpm tf:<folder> plan` and
  # expect No changes before trusting the new provider (TERRAFORM.md).
  - package-ecosystem: terraform
    directories: [/ops/terraform/aws, /ops/terraform/cloudflare]
    schedule:
      interval: weekly
      day: sunday
      time: '04:00'
      timezone: Asia/Dhaka
    labels: [dependencies, infra]
    groups:
      providers:
        update-types: [minor, patch]
