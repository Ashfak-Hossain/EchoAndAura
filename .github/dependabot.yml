# Dependency updates (see docs/DEVELOPMENT.md → Dependencies). Versions stay
# pinned exactly: Dependabot moves the pin, it never adds a range. Minor and
# patch bumps come as one grouped PR per ecosystem per week; majors come one
# by one, because each needs its own reading of the upgrade notes.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: sunday
      time: '04:00'
      timezone: Asia/Dhaka
    open-pull-requests-limit: 5
    labels: [dependencies]
    ignore:
      # The door scanner runs the zxing-wasm that barcode-detector pins
      # exactly, and serves its .wasm from public/vendor/. It moves only with
      # barcode-detector, by hand (docs/DEVELOPMENT.md → Dependencies).
      - dependency-name: zxing-wasm
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: sunday
      time: '04:00'
      timezone: Asia/Dhaka
    labels: [dependencies, ci]
    groups:
      actions:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: sunday
      time: '04:00'
      timezone: Asia/Dhaka
    labels: [dependencies, infra]

  # Terraform providers (ADR-062): moves the exact `version` pin in
  # versions.tf and the lock file. Not Terraform itself (required_version,
  # CI's terraform_version): that is a by-hand upgrade. CI only proves the
  # code still validates; after merging, run `pnpm tf:<folder> plan` and
  # expect No changes before trusting the new provider (TERRAFORM.md).
  - package-ecosystem: terraform
    directories: [/ops/terraform/aws, /ops/terraform/cloudflare]
    schedule:
      interval: weekly
      day: sunday
      time: '04:00'
      timezone: Asia/Dhaka
    labels: [dependencies, infra]
    groups:
      providers:
        update-types: [minor, patch]
