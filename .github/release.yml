# Sections of the release notes GitHub generates from merged PRs
# (docs/DEVELOPMENT.md → Releases).
changelog:
  exclude:
    labels: [skip-changelog]
  categories:
    - title: Features
      labels: [feature, enhancement]
    - title: Fixes
      labels: [bug, fix]
    - title: Security
      labels: [security]
    - title: Operations and infrastructure
      labels: [infra, ci, ops]
    - title: Documentation
      labels: [documentation]
    - title: Dependencies
      labels: [dependencies]
    - title: Other changes
      labels: ['*']
