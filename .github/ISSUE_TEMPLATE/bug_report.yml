name: Bug report
description: Something on the site or in the admin doesn't work as it should.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: And what you expected instead. Never paste buyer data, trxIDs or secrets.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to …
        2. Click …
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where
      options: [Public site, Admin, Door scanner, Email, Worker / jobs, Deploy / infrastructure]
    validations:
      required: true
  - type: input
    id: when
    attributes:
      label: When (Dhaka time) and the order reference, if any
      placeholder: 2026-10-10 19:45, EA-7K3M9Q
  - type: textarea
    id: extra
    attributes:
      label: Screenshots, logs, device / browser
